<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyFlow — Typing Speed Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Key<span>Flow</span></div>
    <div class="tagline">Typing Speed Test</div>
  </header>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="15">15 sec</button>
    <button class="mode-btn" data-mode="30">30 sec</button>
    <button class="mode-btn" data-mode="60">60 sec</button>
    <button class="mode-btn" data-mode="free">Free Mode</button>
  </div>

  <div class="timer-display" id="timerDisplay">15</div>

  <div class="typing-wrapper">
    <div class="words-display" id="wordsDisplay" tabindex="0">
      <div class="click-hint" id="clickHint">Click here or press any key to start</div>
    </div>
    <input class="hidden-input" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="live-stats">
    <div class="stat-item">
      <div class="stat-value" id="liveWpm">—</div>
      <div class="stat-label">WPM</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="liveAcc">—</div>
      <div class="stat-label">Accuracy</div>
    </div>
    <div class="stat-item" id="freeWordStat" style="display:none">
      <div class="stat-value" id="liveWords">0</div>
      <div class="stat-label">Words</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="resetBtn">↺ Restart <kbd>Tab</kbd></button>
  </div>

  <!-- RESULTS PANEL -->
  <div class="results-panel" id="resultsPanel">
    <div class="results-title">// Results</div>
    <div class="results-grid">
      <div class="result-item">
        <div class="result-value" id="resWpm">0</div>
        <div class="result-label">WPM</div>
      </div>
      <div class="result-item secondary">
        <div class="result-value" id="resRaw">0</div>
        <div class="result-label">Raw WPM</div>
      </div>
      <div class="result-item secondary">
        <div class="result-value" id="resAcc">0%</div>
        <div class="result-label">Accuracy</div>
      </div>
      <div class="result-item secondary">
        <div class="result-value" id="resCorrect">0</div>
        <div class="result-label">Correct Words</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="resetTest()">↺ Try Again</button>
  </div>
</div>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
